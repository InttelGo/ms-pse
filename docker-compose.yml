services:
  ms-pse:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SEED: ${APP_SEED:-true}
      TIMEZONE: ${TIMEZONE:-America/Bogota}
      PORT: 8009
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ms-pse}
      MS_BUILD_URL: ${MS_BUILD_URL:-http://host.docker.internal:8008}
      MS_SERVICE_URL: ${MS_SERVICE_URL:-http://host.docker.internal:8007}
      LANDINGPAGE_URL: ${LANDINGPAGE_URL:-}
      PSE_HASH_SECRET: ${PSE_HASH_SECRET:?}
      PSE_URL: ${PSE_URL:?}
      PSE_AUTH_PATH: ${PSE_AUTH_PATH:?}
      PSE_VERSION: ${PSE_VERSION:-v2}
      PSE_API_KEY: ${PSE_API_KEY:?}
      PSE_CLIENT_ID: ${PSE_CLIENT_ID:?}
      PSE_CLIENT_SECRET: ${PSE_CLIENT_SECRET:?}
      PSE_ENCRYPT_KEY: ${PSE_ENCRYPT_KEY:?}
      PSE_ENCRYPT_IV: ${PSE_ENCRYPT_IV:?}
      PSE_ENTITY_CODE: ${PSE_ENTITY_CODE:?}
      PSE_SERVICE_CODE: ${PSE_SERVICE_CODE:?}
      PSE_ENTITY_URL: ${PSE_ENTITY_URL:?}
      PSE_BENEFICIARY_TYPE: ${PSE_BENEFICIARY_TYPE:-}
      PSE_BENEFICIARY_IDENTIFY: ${PSE_BENEFICIARY_IDENTIFY:-}
      PSE_BENEFICIARY_NAME: ${PSE_BENEFICIARY_NAME:-}
      PSE_BENEFICIARY_CATEGORY: ${PSE_BENEFICIARY_CATEGORY:-}
      PSE_TIMEOUT_SECONDS: ${PSE_TIMEOUT_SECONDS:-30}
      PSE_DESCRIPTION_MAX_LENGTH: ${PSE_DESCRIPTION_MAX_LENGTH:-80}
      PSE_PENDING_JOB: ${PSE_PENDING_JOB:-true}
      PSE_PENDING_CRON: ${PSE_PENDING_CRON:-0 */3 * * * *}
      PSE_PENDING_MAX_HOURS: ${PSE_PENDING_MAX_HOURS:-24}
      PSE_SYSTEM_USER_ID: ${PSE_SYSTEM_USER_ID:-119}
      PSE_BUILD_METHOD_ID: ${PSE_BUILD_METHOD_ID:-2}
      PSE_BUILD_OFFICE_ID: ${PSE_BUILD_OFFICE_ID:-1}
      PSE_BUILD_STATUS_ID: ${PSE_BUILD_STATUS_ID:-1}
      PSE_ELECTRONIC_BUILD: ${PSE_ELECTRONIC_BUILD:-false}
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-true}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_VERIFY_URL: ${RECAPTCHA_VERIFY_URL:-https://www.google.com/recaptcha/api/siteverify}
    ports:
      - "8009:8009"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ms-pse}
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
